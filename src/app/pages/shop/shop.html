<section class="section section--tight">
  <div class="wrap">
    <p class="eyebrow eyebrow--hazard">Catalogo</p>
    <h1 class="display--page" style="margin-top: 16px; max-width: 14ch">Tutte le sostanze imbottigliate.</h1>
  </div>
</section>

<section class="section--tight">
  <div class="wrap">
    <div class="row" style="justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 16px">
      <div class="filters" style="margin-bottom: 0">
        <button type="button" class="filter-chip" [class.on]="active() === 'tutte'" (click)="active.set('tutte')">
          Tutte ({{ total }})
        </button>
        @for (line of lines; track line.id) {
          <button type="button" class="filter-chip" [class.on]="active() === line.id" (click)="active.set(line.id)">
            {{ line.name.replace('Linea ', '') }}
          </button>
        }
      </div>

      <div class="field" style="width: auto; min-width: 200px">
        <label for="sort">Ordina per</label>
        <select id="sort" [value]="sort()" (change)="sort.set($any($event.target).value)">
          <option value="nome">Nome</option>
          <option value="shu-asc">Piccantezza crescente</option>
          <option value="shu-desc">Piccantezza decrescente</option>
        </select>
      </div>
    </div>

    <div class="grid grid--4">
      @for (product of filtered(); track product.slug) {
        <app-product-card [product]="product" />
      }
    </div>
  </div>
</section>
